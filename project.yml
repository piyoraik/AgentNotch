name: ClaudeNotch
options:
  bundleIdPrefix: com.piyoraik
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
targets:
  ClaudeNotch:
    type: application
    platform: macOS
    sources:
      - path: Sources/ClaudeNotch
    info:
      path: Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: ClaudeNotch
        NSAppleEventsUsageDescription: セッションを実行しているターミナルのタブを前面に出すために使用します。
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.piyoraik.ClaudeNotch
        ENABLE_HARDENED_RUNTIME: false
  claudenotch-bridge:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Bridge
    settings:
      base:
        PRODUCT_NAME: claudenotch-bridge
        PRODUCT_BUNDLE_IDENTIFIER: com.piyoraik.ClaudeNotch.bridge
