name: AgentNotch
options:
  bundleIdPrefix: com.piyoraik
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
targets:
  AgentNotch:
    type: application
    platform: macOS
    sources:
      - path: Sources/AgentNotch
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: AgentNotch
        NSAppleEventsUsageDescription: セッションを実行しているターミナルのタブを前面に出すために使用します。
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.piyoraik.AgentNotch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: false
  agentnotch-bridge:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Bridge
    settings:
      base:
        PRODUCT_NAME: agentnotch-bridge
        PRODUCT_BUNDLE_IDENTIFIER: com.piyoraik.AgentNotch.bridge
