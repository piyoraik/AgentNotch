name: AgentNotch
options:
  bundleIdPrefix: com.piyoraik
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # 配布物は元々 ad-hoc 署名なので、署名も明示して固定する。
    # Automatic のままだと、Xcode に Apple Developer アカウントを設定している
    # マシンでは com.piyoraik.AgentNotch を相手のチームに登録しようとして落ちる。
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.10.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AgentNotch:
    type: application
    platform: macOS
    sources:
      - path: Sources/AgentNotch
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: AgentNotch
        # XcodeGen は既定で 1.0 / 1 を書き込むので、ビルド設定を参照させる。
        # 版を上げるときは settings.base の MARKETING_VERSION だけを直す。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppleEventsUsageDescription: セッションを実行しているターミナルのタブを前面に出すために使用します。
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.piyoraik.AgentNotch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: false
    # ブリッジを Contents/MacOS に同梱する。.app だけ受け取った人が
    # ソースを持たずに承認フックを組めるようにするため。
    dependencies:
      - target: agentnotch-bridge
        embed: true
        copy:
          destination: executables
  agentnotch-bridge:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Bridge
    settings:
      base:
        PRODUCT_NAME: agentnotch-bridge
        PRODUCT_BUNDLE_IDENTIFIER: com.piyoraik.AgentNotch.bridge
